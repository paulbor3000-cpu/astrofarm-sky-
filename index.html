<!DOCTYPE html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astrofarm Sky Map</title>

<!--
  Rebuilt on d3-celestial (BSD license, github.com/ofrohn/d3-celestial),
  loaded pinned to @master via jsdelivr's GitHub CDN. For long-term
  stability, consider re-pinning this to a specific commit hash once this

-->
<script src="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/lib/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/lib/d3.geo.projection.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/celestial.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/celestial.css">

<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #050f0a; overflow: hidden;
    font-family: -apple-system, sans-serif;
  }
  #celestial-map { width: 100%; height: 100%; background: #050f0a; }
  #celestial-map svg, #celestial-map canvas { background: #050f0a; }

  #loading {
    position: fixed; inset: 0; background: #050f0a;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.4); font-size: 12px; letter-spacing: 1px;
    z-index: 50;
  }

  #ar-toggle {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: rgba(5,15,10,0.85); border: 1px solid rgba(77,255,145,0.35);
    color: #4dff91; padding: 10px 20px; border-radius: 24px;
    font-size: 13px; font-weight: 600; z-index: 40;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  #ar-toggle.active {
    background: #4dff91; color: #050f0a; border-color: #4dff91;
  }

  .obj-label {
    position: absolute; pointer-events: none;
    color: #d6a574; font-size: 10px; font-weight: 600;
    text-shadow: 0 0 4px #000, 0 0 4px #000;
    transform: translate(8px, -6px);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="loading">LOADING SKY MAP...</div>
<div id="celestial-map"></div>
<div id="ar-toggle">📍 TAP FOR AR VIEW</div>
<div id="obj-labels"></div>

<script>
// ============================================================
// Curated, tappable objects — same catalog as the app's Sky Atlas /
// camera-guide AR flow (lib/skyObjectCoordinates.ts). Kept in sync
// manually; if that file changes, mirror the changes here too.
// RA in hours, Dec in degrees (same convention as the source file).
// ============================================================
var SKY_OBJECT_COORDS = {

  M45: { ra: 3.783, dec: 24.117, name: "Pleiades" },
  M1: { ra: 5.575, dec: 22.01, name: "Crab Nebula" },

  NGC869: { ra: 2.317, dec: 57.13, name: "Double Cluster" },
  M35: { ra: 6.15, dec: 24.35, name: "M35" },
  NGC2392: { ra: 7.48, dec: 20.91, name: "Eskimo Nebula" },
  M65: { ra: 11.31, dec: 13.09, name: "Leo Triplet" },
  M44: { ra: 8.67, dec: 19.67, name: "Beehive Cluster" },
  M81: { ra: 9.92, dec: 69.07, name: "Bode's Galaxy" },
  M82: { ra: 9.93, dec: 69.68, name: "Cigar Galaxy" },
  M51: { ra: 13.498, dec: 47.195, name: "Whirlpool Galaxy" },

  M8: { ra: 18.06, dec: -24.38, name: "Lagoon Nebula" },

  Albireo: { ra: 19.512, dec: 27.96, name: "Albireo" },
  M31: { ra: 0.712, dec: 41.269, name: "Andromeda Galaxy" },
  M33: { ra: 1.56, dec: 30.66, name: "Triangulum Galaxy" },
  M15: { ra: 21.5, dec: 12.17, name: "Globular Cluster M15" },
  NGC7331: { ra: 22.62, dec: 34.42, name: "NGC 7331" },
  NGC253: { ra: 0.79, dec: -25.29, name: "Sculptor Galaxy" },
  NGC7293: { ra: 22.49, dec: -20.84, name: "Helix Nebula" },
  NGC891: { ra: 2.38, dec: 42.35, name: "Edge-on Galaxy NGC 891" },
  NGC1499: { ra: 4.05, dec: 36.42, name: "California Nebula" },
  IC1805: { ra: 2.54, dec: 61.45, name: "Heart Nebula" },
  M77: { ra: 2.71, dec: -0.01, name: "M77" },
  NGC2024: { ra: 5.68, dec: -1.85, name: "Flame Nebula" },
  IC405: { ra: 5.27, dec: 34.35, name: "Flaming Star Nebula" },
  Polaris: { ra: 2.53, dec: 89.264, name: "Polaris" },
  M97: { ra: 11.25, dec: 55.02, name: "Owl Nebula" },
  NGC6543: { ra: 17.883, dec: 66.633, name: "Cat's Eye Nebula" },
  M29: { ra: 20.4, dec: 38.53, name: "M29 Cluster" },
  IC1318: { ra: 20.28, dec: 41.28, name: "Butterfly Nebula" },
  Vega: { ra: 18.615, dec: 38.784, name: "Vega" },
  Deneb: { ra: 20.69, dec: 45.28, name: "Deneb" },
  M39: { ra: 21.53, dec: 48.43, name: "M39 Cluster" },
  NGC7000: { ra: 20.98, dec: 44.33, name: "North America Nebula" },
  M56: { ra: 19.28, dec: 30.18, name: "Globular Cluster M56" },
  NGC6888: { ra: 20.2, dec: 38.35, name: "Crescent Nebula" },
  M71: { ra: 19.90, dec: 18.78, name: "Globular Cluster M71" },
  M55: { ra: 19.67, dec: -30.96, name: "Globular Cluster M55" },
  NGC6752: { ra: 19.18, dec: -59.98, name: "NGC 6752" },
  M6: { ra: 17.67, dec: -32.22, name: "Butterfly Cluster" },
  M7: { ra: 17.90, dec: -34.79, name: "Ptolemy Cluster" },
  M24: { ra: 18.28, dec: -18.55, name: "Sagittarius Star Cloud" }
};

// ============================================================
// Horizontal (Az/Alt) -> Equatorial (RA/Dec) conversion.
// Uses the atan2-based hour-angle formula (avoids the classic acos
// quadrant/sign bug): H = atan2(-sinA, tanH*cosLat - cosA*sinLat).
// Verified against standard spherical-astronomy references.
// ============================================================
function toJulianDate(date) {
  return date.getTime() / 86400000 + 2440587.5;
}

function getLST(date, lonDeg) {
  var JD = toJulianDate(date);
  var D = JD - 2451545.0;
  var GMST = 18.697374558 + 24.06570982441908 * D;
  GMST = ((GMST % 24) + 24) % 24;
  var LST = GMST + lonDeg / 15;
  return ((LST % 24) + 24) % 24;
}

function horizontalToEquatorial(azDeg, altDeg, latDeg, lonDeg, date) {
  var D2R = Math.PI / 180, R2D = 180 / Math.PI;
  var az = azDeg * D2R, alt = altDeg * D2R, lat = latDeg * D2R;

  var sinDec = Math.sin(alt) * Math.sin(lat) + Math.cos(alt) * Math.cos(lat) * Math.cos(az);
  var dec = Math.asin(sinDec);

  var H = Math.atan2(
    -Math.sin(az),
    Math.tan(alt) * Math.cos(lat) - Math.cos(az) * Math.sin(lat)
  );
  var Hhours = (H * R2D) / 15;
  var LST = getLST(date, lonDeg);
  var raHours = ((LST - Hhours) % 24 + 24) % 24;

  return { raHours: raHours, decDeg: dec * R2D };
}

// ============================================================
// App color theme (matches ACCENT/GOLD/BG used throughout the RN app)
// ============================================================
var config = {
  width: window.innerWidth,
  projection: "orthographic",
  transform: "equatorial",
  center: null,
  geopos: null,
  follow: "center",
  interactive: true,
  controls: false, // d3-celestial's own +/- zoom buttons were overlapping our custom AR-toggle UI
  adaptable: true,
  disableAnimations: false,
  background: { fill: "#050f0a", opacity: 1 },
  stars: {
    show: true, limit: 6, colors: true,
    style: { fill: "#ffffff", opacity: 1 },
    names: false
  },
  constellations: {
    show: true,
    lines: true, names: true, namesType: "iau",
    lineStyle: { stroke: "#4dff91", width: 1, opacity: 0.25 },
    nameStyle: { fill: "rgba(255,255,255,0.35)", font: "11px sans-serif", align: "center", baseline: "middle" }
  },
  dsos: { show: true, limit: 6, colors: true, names: false },
  mw: { show: true, style: { fill: "#ffffff", opacity: 0.06 } },
  planets: { show: true },
  daylight: { show: false },
  container: "celestial-map",
  datapath: "https://cdn.jsdelivr.net/gh/ofrohn/d3-celestial@master/data/"
};

var mapInitialized = false;
var arActive = false;
var currentLatLon = null;
var overlayPositions = {}; // id -> {x, y, name, ra, dec}, refreshed every redraw
var labelNodes = {}; // id -> DOM node, reused across redraws instead of rebuilt

function sendToRN(event, data) {
  var msg = JSON.stringify({ event: event, data: data || {} });
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(msg);
}

function initMap() {
  if (mapInitialized || !currentLatLon) return;
  mapInitialized = true;
  // Set container's pixel size explicitly BEFORE Celestial.display() runs —
  // calling display() before the container has settled layout dimensions
  // was the cause of the shifted/cropped globe (d3-celestial computes its
  // projection radius from the container size at call time, once, not
  // reactively).
  var mapEl = document.getElementById('celestial-map');
  mapEl.style.width = window.innerWidth + 'px';
  mapEl.style.height = window.innerHeight + 'px';
  config.width = window.innerWidth;

  config.geopos = [currentLatLon.lat, currentLatLon.lon];
  Celestial.display(config);
  Celestial.addCallback(redrawOverlay);
  document.getElementById('loading').style.display = 'none';
  sendToRN('MAP_READY');
}

// Draws the curated tappable objects as gold markers on top of
// d3-celestial's own canvas. Uses the SAME documented pipeline as
// d3-celestial's own point-data tutorial (getData -> mapProjection),
// rather than the lower-level getPoint() call, which had a units
// mismatch. Label DOM nodes are reused by id across redraws (not
// recreated every frame) — the previous version's innerHTML='' + rebuild
// on every single redraw during a drag gesture was the cause of the
// flicker while panning.
function redrawOverlay() {
  var ctx = Celestial.context;
  if (!ctx) return;

  var geojson = {
    type: 'FeatureCollection',
    features: Object.keys(SKY_OBJECT_COORDS).map(function (id) {
      var obj = SKY_OBJECT_COORDS[id];
      return {
        type: 'Feature',
        id: id,
        properties: { name: obj.name, ra: obj.ra, dec: obj.dec },
        geometry: { type: 'Point', coordinates: [obj.ra * 15, obj.dec] } // degrees, GeoJSON [lon, lat] convention
      };
    })
  };
  var transformed = Celestial.getData(geojson, config.transform);

  var seenIds = {};

  transformed.features.forEach(function (feature) {
    var id = feature.id;
    var props = feature.properties;
    var pt;
    try {
      pt = Celestial.mapProjection(feature.geometry.coordinates);
    } catch (e) {
      return;
    }
    if (!pt || isNaN(pt[0]) || isNaN(pt[1])) return;
    if (pt[0] < -50 || pt[1] < -50 || pt[0] > ctx.canvas.width + 50 || pt[1] > ctx.canvas.height + 50) return;

    seenIds[id] = true;
    overlayPositions[id] = { x: pt[0], y: pt[1], name: props.name, ra: props.ra, dec: props.dec };

    ctx.beginPath();
    ctx.arc(pt[0], pt[1], 4, 0, 2 * Math.PI);
    ctx.fillStyle = 'rgba(214,165,116,0.5)';
    ctx.fill();
    ctx.fillStyle = '#d6a574';
    ctx.beginPath();
    ctx.arc(pt[0], pt[1], 4, 0, 2 * Math.PI);
    ctx.fill();

    var label = labelNodes[id];
    if (!label) {
      label = document.createElement('div');
      label.className = 'obj-label';
      label.textContent = props.name;
      document.getElementById('obj-labels').appendChild(label);
      labelNodes[id] = label;
    }
    label.style.display = 'block';
    label.style.left = pt[0] + 'px';
    label.style.top = pt[1] + 'px';
  });

  // Hide (don't remove) labels for objects that are off-screen this frame —
  // avoids DOM churn, just toggles visibility.
  Object.keys(labelNodes).forEach(function (id) {
    if (!seenIds[id]) labelNodes[id].style.display = 'none';
  });
}

// Tap-to-identify — deliberately a plain 'click' listener (fires only on
// tap-without-drag in both browser and WebView touch handling), so it
// doesn't fight with d3-celestial's own built-in pan/zoom drag gestures.
document.getElementById('celestial-map').addEventListener('click', function (e) {
  var rect = e.target.getBoundingClientRect ? e.target.closest('#celestial-map').getBoundingClientRect() : { left: 0, top: 0 };
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;

  var closestId = null, closestDist = 22; // px hit radius
  Object.keys(overlayPositions).forEach(function (id) {
    var p = overlayPositions[id];
    var d = Math.hypot(x - p.x, y - p.y);
    if (d < closestDist) { closestDist = d; closestId = id; }
  });

  if (closestId) {
    var p = overlayPositions[closestId];
    sendToRN('GUIDE_TO_OBJECT', { ra: p.ra, dec: p.dec, name: p.name });
  }
});

document.getElementById('ar-toggle').addEventListener('click', function () {
  arActive = !arActive;
  var el = document.getElementById('ar-toggle');
  if (arActive) {
    el.classList.add('active');
    el.textContent = '🧭 AR VIEW ON';
  } else {
    el.classList.remove('active');
    el.textContent = '📍 TAP FOR AR VIEW';
  }
  sendToRN('AR_TOGGLE', { enabled: arActive });
});

// ============================================================
// Bridge from React Native — same message shapes StarMap.tsx has always
// sent, no changes needed on the app side.
// ============================================================
window.addEventListener('message', function (event) {
  try {
    var msg = JSON.parse(event.data);

    if (msg.type === 'LOCATION') {
      currentLatLon = { lat: msg.lat, lon: msg.lon };
      initMap();
    }

    if (msg.type === 'COMPASS' && mapInitialized && arActive && currentLatLon) {
      var eq = horizontalToEquatorial(msg.azimuth, msg.altitude, currentLatLon.lat, currentLatLon.lon, new Date());
      // Celestial.rotate's center expects degrees (per the main README —
      // a demo file comment claimed hours for equatorial mode specifically,
      // which contradicted the README and was the actual cause of the
      // blank AR view: passing an hours value (0-24) where degrees (0-360)
      // was expected effectively centered the view on a near-meaningless
      // sliver of sky).
      Celestial.rotate({ center: [eq.raHours * 15, eq.decDeg] });
    }
  } catch (e) {
    // Malformed or unrelated message — ignore.
  }
});

// Fallback: if no location arrives within a few seconds (permission
// denied, GPS unavailable), initialize with a default position anyway so
// the map isn't stuck on the loading screen forever.
setTimeout(function () {
  if (!mapInitialized) {
    currentLatLon = { lat: 39.5, lon: -2.5 }; // roughly central Spain, as a sane default
    initMap();
  }
}, 4000);
</script>
</body>
</html>
